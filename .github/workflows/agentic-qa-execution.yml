name: Agentic QA Execution

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: Execution mode
        required: true
        default: scenario
        type: choice
        options:
          - scenario
          - spec

      run_target:
        description: Execution target
        required: true
        default: local
        type: choice
        options:
          - local
          - browserstack

      target_env:
        description: Target environment
        required: true
        default: UAT
        type: choice
        options:
          - UAT
          - PROD

      production_confirmation:
        description: Type RUN PROD when target environment is PROD
        required: false
        default: ''
        type: string

      scenario_filename:
        description: Scenario filename for scenario mode
        required: false
        default: ''
        type: string

      scenario_content:
        description: Plain-text scenario content
        required: false
        default: ''
        type: string

      spec_path:
        description: Spec path for spec mode
        required: false
        default: ''
        type: string

      mobile_platform:
        description: Mobile platform
        required: false
        default: android
        type: choice
        options:
          - android
          - ios

      browserstack_target_type:
        description: BrowserStack launch type
        required: false
        default: desktop-web
        type: choice
        options:
          - desktop-web
          - mobile-web
          - native-app

      browserstack_browser:
        description: BrowserStack web browser
        required: false
        default: chrome
        type: choice
        options:
          - chrome
          - edge
          - firefox
          - safari

      browserstack_browser_version:
        description: BrowserStack browser version
        required: false
        default: latest
        type: string

      browserstack_os:
        description: BrowserStack operating system
        required: false
        default: OS X
        type: choice
        options:
          - OS X
          - Windows

      browserstack_os_version:
        description: BrowserStack operating-system version
        required: false
        default: Sequoia
        type: string

      browserstack_resolution:
        description: BrowserStack screen resolution
        required: false
        default: 1440x900
        type: choice
        options:
          - 1280x720
          - 1440x900
          - 1920x1080

      browserstack_device:
        description: BrowserStack real mobile device
        required: false
        default: Samsung Galaxy S24
        type: string

      browserstack_mobile_os_version:
        description: BrowserStack mobile operating-system version
        required: false
        default: '14.0'
        type: string

      browserstack_mobile_browser:
        description: Mobile browser for mobile-web execution
        required: false
        default: chrome
        type: choice
        options:
          - chrome
          - safari

      browserstack_device_orientation:
        description: BrowserStack mobile-device orientation
        required: false
        default: portrait
        type: choice
        options:
          - portrait
          - landscape

      browserstack_real_mobile:
        description: Use a BrowserStack real mobile device
        required: false
        default: true
        type: boolean

      browserstack_local:
        description: Use BrowserStack Local tunnel
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: agentic-qa-${{ inputs.target_env }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa-execution:
    name: Agentic QA - ${{ inputs.target_env }}

    runs-on:
      - self-hosted
      - macOS

    # Create GitHub Environments named UAT and PROD.
    # Add required reviewers to the PROD environment.
    environment:
      name: ${{ inputs.target_env }}

    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      CI: 'true'

      RUN_TARGET: ${{ inputs.run_target }}
      TARGET_ENV: ${{ inputs.target_env }}
      MOBILE_PLATFORM: ${{ inputs.mobile_platform }}

      BUILD_SHAREABLE_REPORT: 'true'
      OPEN_REPORT: 'false'
      RUN_GENERATED_SPEC: 'true'

      HEADLESS: 'true'
      MCP_SERVER_MODE: local

      BROWSERSTACK_TARGET_TYPE: ${{ inputs.browserstack_target_type }}
      BROWSERSTACK_BROWSER: ${{ inputs.browserstack_browser }}
      BROWSERSTACK_BROWSER_VERSION: ${{ inputs.browserstack_browser_version }}
      BROWSERSTACK_OS: ${{ inputs.browserstack_os }}
      BROWSERSTACK_OS_VERSION: ${{ inputs.browserstack_os_version }}
      BROWSERSTACK_RESOLUTION: ${{ inputs.browserstack_resolution }}
      BROWSERSTACK_DEVICE: ${{ inputs.browserstack_device }}
      BROWSERSTACK_MOBILE_OS_VERSION: ${{ inputs.browserstack_mobile_os_version }}
      BROWSERSTACK_MOBILE_BROWSER: ${{ inputs.browserstack_mobile_browser }}
      BROWSERSTACK_DEVICE_ORIENTATION: ${{ inputs.browserstack_device_orientation }}
      BROWSERSTACK_REAL_MOBILE: ${{ inputs.browserstack_real_mobile }}
      BROWSERSTACK_LOCAL: ${{ inputs.browserstack_local }}

      # GitHub Actions secrets are the primary credential source.
      # Local .credentials/*.env files remain optional fallbacks for self-hosted runs.
      LOGIN_URL_UAT: ${{ secrets.LOGIN_URL_UAT }}
      LOGIN_URL_PROD: ${{ secrets.LOGIN_URL_PROD }}
      TEST_LOGIN_EMAIL: ${{ secrets.TEST_LOGIN_EMAIL }}
      TEST_LOGIN_PASSWORD: ${{ secrets.TEST_LOGIN_PASSWORD }}
      URL_UAT: ${{ secrets.URL_UAT }}
      URL_PROD: ${{ secrets.URL_PROD }}

      WEB_BASE_URL: ${{ inputs.target_env == 'PROD' && secrets.URL_PROD || secrets.URL_UAT }}
      BASE_URL: ${{ inputs.target_env == 'PROD' && secrets.URL_PROD || secrets.URL_UAT }}
      GENERATED_SPEC_DETERMINISTIC_AUTH: 'true'

      AGENTIC_QA_CREDENTIALS_DIR: ${{ github.workspace }}/.credentials
      PLAYWRIGHT_AUTH_DIR: ${{ github.workspace }}/artifacts/.auth

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Preserves ignored .credentials files on the self-hosted runner.
          clean: false
          fetch-depth: 1

      - name: Validate production approval
        env:
          REQUESTED_ENV: ${{ inputs.target_env }}
          PROD_CONFIRMATION: ${{ inputs.production_confirmation }}
        run: |
          set -euo pipefail

          if [[ "$REQUESTED_ENV" == "PROD" ]]; then
            if [[ "$PROD_CONFIRMATION" != "RUN PROD" ]]; then
              echo "::error::Production execution requires production_confirmation to be exactly: RUN PROD"
              exit 1
            fi

            echo "Production confirmation validated."
          else
            echo "UAT execution selected."
          fi

      - name: Display execution configuration
        run: |
          set -euo pipefail

          echo "Run mode: ${{ inputs.run_mode }}"
          echo "Run target: ${{ inputs.run_target }}"
          echo "Environment: ${{ inputs.target_env }}"
          echo "Mobile platform: ${{ inputs.mobile_platform }}"

          if [[ "${{ inputs.run_target }}" == "browserstack" ]]; then
            echo "BrowserStack target type: ${{ inputs.browserstack_target_type }}"
            echo "BrowserStack browser: ${{ inputs.browserstack_browser }}"
            echo "BrowserStack browser version: ${{ inputs.browserstack_browser_version }}"
            echo "BrowserStack OS: ${{ inputs.browserstack_os }}"
            echo "BrowserStack OS version: ${{ inputs.browserstack_os_version }}"
            echo "BrowserStack resolution: ${{ inputs.browserstack_resolution }}"
            echo "BrowserStack device: ${{ inputs.browserstack_device }}"
            echo "BrowserStack mobile OS version: ${{ inputs.browserstack_mobile_os_version }}"
            echo "BrowserStack mobile browser: ${{ inputs.browserstack_mobile_browser }}"
            echo "BrowserStack orientation: ${{ inputs.browserstack_device_orientation }}"
            echo "BrowserStack real mobile: ${{ inputs.browserstack_real_mobile }}"
            echo "BrowserStack Local: ${{ inputs.browserstack_local }}"
          fi

      - name: Validate workflow inputs
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          SCENARIO_FILENAME: ${{ inputs.scenario_filename }}
          SCENARIO_CONTENT: ${{ inputs.scenario_content }}
          SPEC_PATH: ${{ inputs.spec_path }}
        run: |
          set -euo pipefail

          if [[ "$RUN_MODE" == "scenario" ]]; then
            if [[ -z "$SCENARIO_FILENAME" ]]; then
              echo "::error::scenario_filename is required in scenario mode."
              exit 1
            fi

            if [[ -z "$SCENARIO_CONTENT" ]]; then
              echo "::error::scenario_content is required in scenario mode."
              exit 1
            fi

            if [[ ! "$SCENARIO_FILENAME" =~ ^[A-Za-z0-9._-]+\.txt$ ]]; then
              echo "::error::Invalid scenario filename: $SCENARIO_FILENAME"
              exit 1
            fi
          fi

          if [[ "$RUN_MODE" == "spec" ]]; then
            if [[ -z "$SPEC_PATH" ]]; then
              echo "::error::spec_path is required in spec mode."
              exit 1
            fi
          fi

      - name: Check runtime
        run: |
          set -euo pipefail

          node --version
          npm --version

      - name: Install dependencies
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail

          npx playwright install chromium

      - name: Create incoming scenario
        if: ${{ inputs.run_mode == 'scenario' }}
        env:
          SCENARIO_FILENAME: ${{ inputs.scenario_filename }}
          SCENARIO_CONTENT: ${{ inputs.scenario_content }}
        run: |
          set -euo pipefail

          mkdir -p scenarios/incoming

          SCENARIO_PATH="scenarios/incoming/$SCENARIO_FILENAME"

          printf '%s\n' "$SCENARIO_CONTENT" > "$SCENARIO_PATH"

          SCENARIO_NAME="${SCENARIO_FILENAME%.txt}"

          {
            echo "QA_SCENARIO_PATH=$SCENARIO_PATH"
            echo "QA_SCENARIO_NAME=$SCENARIO_NAME"
          } >> "$GITHUB_ENV"

          echo "Scenario created: $SCENARIO_PATH"


      - name: Validate BrowserStack configuration
        if: ${{ inputs.run_target == 'browserstack' }}
        run: |
          set -euo pipefail

          case "$BROWSERSTACK_TARGET_TYPE" in
            desktop-web|mobile-web|native-app)
              ;;
            *)
              echo "::error::Unsupported BrowserStack target type: $BROWSERSTACK_TARGET_TYPE"
              exit 1
              ;;
          esac

          if [[ "$BROWSERSTACK_TARGET_TYPE" == "desktop-web" ]]; then
            if [[ -z "$BROWSERSTACK_BROWSER" ]]; then
              echo "::error::BrowserStack browser is required for desktop-web."
              exit 1
            fi

            if [[ -z "$BROWSERSTACK_OS" ]]; then
              echo "::error::BrowserStack OS is required for desktop-web."
              exit 1
            fi
          fi

          if [[ "$BROWSERSTACK_TARGET_TYPE" == "mobile-web" || "$BROWSERSTACK_TARGET_TYPE" == "native-app" ]]; then
            if [[ -z "$BROWSERSTACK_DEVICE" ]]; then
              echo "::error::BrowserStack device is required for mobile execution."
              exit 1
            fi

            if [[ -z "$BROWSERSTACK_MOBILE_OS_VERSION" ]]; then
              echo "::error::BrowserStack mobile OS version is required."
              exit 1
            fi

            case "$BROWSERSTACK_DEVICE_ORIENTATION" in
              portrait|landscape)
                ;;
              *)
                echo "::error::Unsupported device orientation: $BROWSERSTACK_DEVICE_ORIENTATION"
                exit 1
                ;;
            esac
          fi

          if [[ "$BROWSERSTACK_TARGET_TYPE" == "mobile-web" ]]; then
            if [[ "$MOBILE_PLATFORM" == "android" && "$BROWSERSTACK_MOBILE_BROWSER" != "chrome" ]]; then
              echo "::error::Android mobile-web execution must use Chrome."
              exit 1
            fi

            if [[ "$MOBILE_PLATFORM" == "ios" && "$BROWSERSTACK_MOBILE_BROWSER" != "safari" ]]; then
              echo "::error::iOS mobile-web execution must use Safari."
              exit 1
            fi
          fi

          echo "BrowserStack configuration is valid."

      - name: Load BrowserStack credentials
        if: ${{ inputs.run_target == 'browserstack' }}
        run: |
          set -euo pipefail

          CREDENTIALS_FILE="$AGENTIC_QA_CREDENTIALS_DIR/browserstack.env"

          if [[ ! -f "$CREDENTIALS_FILE" ]]; then
            echo "::error::BrowserStack credentials file was not found:"
            echo "::error::$CREDENTIALS_FILE"
            exit 1
          fi

          set -a

          # shellcheck disable=SC1090
          source "$CREDENTIALS_FILE"

          set +a

          if [[ -z "${BROWSERSTACK_USERNAME:-}" ]]; then
            echo "::error::BROWSERSTACK_USERNAME is missing from browserstack.env."
            exit 1
          fi

          if [[ -z "${BROWSERSTACK_ACCESS_KEY:-}" ]]; then
            echo "::error::BROWSERSTACK_ACCESS_KEY is missing from browserstack.env."
            exit 1
          fi

          echo "::add-mask::$BROWSERSTACK_USERNAME"
          echo "::add-mask::$BROWSERSTACK_ACCESS_KEY"

          {
            echo "BROWSERSTACK_USERNAME=$BROWSERSTACK_USERNAME"
            echo "BROWSERSTACK_ACCESS_KEY=$BROWSERSTACK_ACCESS_KEY"
          } >> "$GITHUB_ENV"

          echo "BrowserStack credentials loaded successfully."

      - name: Detect deterministic login requirement
        if: ${{ inputs.run_mode == 'scenario' }}
        run: |
          set -euo pipefail

          AUTH_REQUIRED=false

          if grep -Eiq \
            '^[[:space:]]*AUTH_REQUIRED:[[:space:]]*(true|yes|required)[[:space:]]*$' \
            "$QA_SCENARIO_PATH"
          then
            AUTH_REQUIRED=true
          fi

          if grep -Eiq \
            '^[[:space:]]*AUTH_FLOW:[[:space:]]*deterministic[[:space:]]*$' \
            "$QA_SCENARIO_PATH"
          then
            AUTH_REQUIRED=true
          fi

          if grep -Eiq \
            '(^|[[:space:]])@(loggedin|logged-in|authenticated|login-required)([[:space:]]|$)' \
            "$QA_SCENARIO_PATH"
          then
            AUTH_REQUIRED=true
          fi

          echo "QA_AUTH_REQUIRED=$AUTH_REQUIRED" >> "$GITHUB_ENV"

          if [[ "$AUTH_REQUIRED" == "true" ]]; then
            echo "Scenario requires deterministic login."
          else
            echo "Scenario does not require deterministic login."
          fi

      - name: Validate deterministic login credentials
        if: ${{ inputs.run_mode == 'scenario' }}
        run: |
          set -euo pipefail

          if [[ "${QA_AUTH_REQUIRED:-false}" != "true" ]]; then
            echo "Deterministic login is not required."
            exit 0
          fi

          TARGET_ENV_UPPER="$(printf '%s' "$TARGET_ENV" | tr '[:lower:]' '[:upper:]')"

          case "$TARGET_ENV_UPPER" in
            UAT)
              REQUIRED_LOGIN_URL_VARIABLE="LOGIN_URL_UAT"
              REQUIRED_TARGET_URL_VARIABLE="URL_UAT"
              ;;
            PROD)
              REQUIRED_LOGIN_URL_VARIABLE="LOGIN_URL_PROD"
              REQUIRED_TARGET_URL_VARIABLE="URL_PROD"
              ;;
            *)
              echo "::error::Unsupported TARGET_ENV: $TARGET_ENV"
              exit 1
              ;;
          esac

          REQUIRED_VARIABLES=(
            "$REQUIRED_LOGIN_URL_VARIABLE"
            "$REQUIRED_TARGET_URL_VARIABLE"
            TEST_LOGIN_EMAIL
            TEST_LOGIN_PASSWORD
          )

          MISSING_VARIABLES=()

          for VARIABLE_NAME in "${REQUIRED_VARIABLES[@]}"; do
            if [[ -z "${!VARIABLE_NAME:-}" ]]; then
              MISSING_VARIABLES+=("$VARIABLE_NAME")
            fi
          done

          if (( ${#MISSING_VARIABLES[@]} > 0 )); then
            echo "::error::Missing GitHub Actions secrets: ${MISSING_VARIABLES[*]}"
            exit 1
          fi

          echo "::add-mask::$TEST_LOGIN_EMAIL"
          echo "::add-mask::$TEST_LOGIN_PASSWORD"

          echo "Deterministic login secrets are available for $TARGET_ENV."

      - name: Prepare protected login credentials file
        if: ${{ inputs.run_mode == 'scenario' }}
        run: |
          set -euo pipefail

          if [[ "${QA_AUTH_REQUIRED:-false}" != "true" ]]; then
            echo "Deterministic login is not required."
            exit 0
          fi

          mkdir -p "$AGENTIC_QA_CREDENTIALS_DIR"
          LOGIN_FILE="$AGENTIC_QA_CREDENTIALS_DIR/login.env"

          {
            printf 'LOGIN_URL_UAT=%s\n' "$LOGIN_URL_UAT"
            printf 'LOGIN_URL_PROD=%s\n' "$LOGIN_URL_PROD"
            printf 'TEST_LOGIN_EMAIL=%s\n' "$TEST_LOGIN_EMAIL"
            printf 'TEST_LOGIN_PASSWORD=%s\n' "$TEST_LOGIN_PASSWORD"
            printf 'URL_UAT=%s\n' "$URL_UAT"
            printf 'URL_PROD=%s\n' "$URL_PROD"
          } > "$LOGIN_FILE"

          chmod 600 "$LOGIN_FILE"

          echo "::add-mask::$TEST_LOGIN_EMAIL"
          echo "::add-mask::$TEST_LOGIN_PASSWORD"
          echo "Protected deterministic login file created."

      - name: Prepare deterministic authenticated state
        if: ${{ inputs.run_mode == 'scenario' }}
        run: |
          set -euo pipefail

          if [[ "${QA_AUTH_REQUIRED:-false}" != "true" ]]; then
            echo "Deterministic login is not required."
            exit 0
          fi

          if [[ ! -f scripts/prepare-auth-state.js ]]; then
            echo "::error::Missing deterministic login implementation: scripts/prepare-auth-state.js"
            exit 1
          fi

          mkdir -p "$PLAYWRIGHT_AUTH_DIR"

          node scripts/prepare-auth-state.js "$QA_SCENARIO_PATH"

          STORAGE_STATE_PATH="$PLAYWRIGHT_AUTH_DIR/woolworths-${TARGET_ENV,,}.json"

          if [[ ! -s "$STORAGE_STATE_PATH" ]]; then
            echo "::error::Authenticated storage state was not created:"
            echo "::error::$STORAGE_STATE_PATH"
            exit 1
          fi

          echo "PLAYWRIGHT_STORAGE_STATE=$STORAGE_STATE_PATH" >> "$GITHUB_ENV"

          echo "Authenticated storage state created:"
          echo "$STORAGE_STATE_PATH"

      - name: Validate deterministic login state
        if: ${{ inputs.run_mode == 'scenario' }}
        run: |
          set -euo pipefail

          if [[ "${QA_AUTH_REQUIRED:-false}" != "true" ]]; then
            echo "No authenticated-state validation required."
            exit 0
          fi

          if [[ -z "${PLAYWRIGHT_STORAGE_STATE:-}" ]]; then
            echo "::error::PLAYWRIGHT_STORAGE_STATE was not configured."
            exit 1
          fi

          if [[ ! -s "$PLAYWRIGHT_STORAGE_STATE" ]]; then
            echo "::error::Authenticated storage-state file is missing or empty."
            exit 1
          fi

          echo "Deterministic authenticated state is ready."

      - name: Validate production scenario restrictions
        if: ${{ inputs.run_mode == 'scenario' && inputs.target_env == 'PROD' }}
        run: |
          set -euo pipefail

          if grep -Eiq \
            '(^|[[:space:]])@(destructive|delete|cancel-order|place-order|payment|purchase)([[:space:]]|$)' \
            "$QA_SCENARIO_PATH"
          then
            echo "::error::Production scenario contains a restricted destructive or transactional tag."
            exit 1
          fi

          if grep -Eiq \
            '^[[:space:]]*ALLOW_PRODUCTION:[[:space:]]*false[[:space:]]*$' \
            "$QA_SCENARIO_PATH"
          then
            echo "::error::Scenario explicitly prevents production execution."
            exit 1
          fi

          echo "Production scenario restrictions passed."

      - name: Run scenario lifecycle
        if: ${{ inputs.run_mode == 'scenario' }}
        run: |
          set -euo pipefail

          npm run scenario:build-and-run -- "$QA_SCENARIO_PATH"

      - name: Validate spec path
        if: ${{ inputs.run_mode == 'spec' }}
        env:
          REQUESTED_SPEC_PATH: ${{ inputs.spec_path }}
        run: |
          set -euo pipefail

          case "$REQUESTED_SPEC_PATH" in
            generated-specs/*.spec.js|\
            generated-specs/*.spec.ts|\
            generated-specs/*.spec.cjs|\
            generated-specs/*.spec.mjs|\
            tests/*.spec.js|\
            tests/*.spec.ts|\
            tests/*.spec.cjs|\
            tests/*.spec.mjs)
              ;;
            *)
              echo "::error::Invalid spec path: $REQUESTED_SPEC_PATH"
              exit 1
              ;;
          esac

          if [[ ! -f "$REQUESTED_SPEC_PATH" ]]; then
            echo "::error::Spec file does not exist: $REQUESTED_SPEC_PATH"
            exit 1
          fi

          echo "QA_SPEC_PATH=$REQUESTED_SPEC_PATH" >> "$GITHUB_ENV"

      - name: Run Playwright spec
        if: ${{ inputs.run_mode == 'spec' }}
        run: |
          set -euo pipefail

          npx playwright test "$QA_SPEC_PATH" --workers=1

      - name: Build shareable report when missing
        if: ${{ always() && inputs.run_mode == 'scenario' }}
        run: |
          set +e

          REPORT_NAME="${QA_SCENARIO_NAME}-report"
          REPORT_PATH="reports/shareable/${REPORT_NAME}.html"

          if [[ -f "$REPORT_PATH" ]]; then
            echo "Shareable report already exists: $REPORT_PATH"
            exit 0
          fi

          QA_SCENARIO_NAME="$QA_SCENARIO_NAME" \
          QA_SCENARIO_TYPE="${QA_SCENARIO_TYPE:-deterministic}" \
          QA_LIFECYCLE_STATUS="${QA_LIFECYCLE_STATUS:-UNKNOWN}" \
          TARGET_ENV="$TARGET_ENV" \
          node scripts/build-shareable-report.js "$REPORT_NAME"

      - name: List generated evidence
        if: ${{ always() }}
        run: |
          set +e

          echo "===== Reports ====="

          find reports \
            -maxdepth 6 \
            -type f \
            2>/dev/null \
            | sort

          echo "===== Images ====="

          find reports artifacts test-results visual-actuals visual-diffs visual-overlays \
            -type f \
            \( \
              -iname '*.png' \
              -o -iname '*.jpg' \
              -o -iname '*.jpeg' \
              -o -iname '*.webp' \
            \) \
            2>/dev/null \
            | sort

      - name: Upload QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ inputs.target_env }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/
            artifacts/
            test-results/
            playwright-report/
            visual-actuals/
            visual-baselines/
            visual-diffs/
            visual-overlays/
