name: QA agent local runner

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: What should be executed?
        required: true
        default: scenario
        type: choice
        options:
          - scenario
          - spec

      scenario_filename:
        description: Scenario filename ending in .txt
        required: false
        default: web-helpcenter-faq-audit.txt
        type: string

      scenario_content:
        description: Complete business scenario content
        required: false
        type: string

      spec_path:
        description: Existing generated Playwright spec
        required: false
        default: generated-specs/web/web-helpcenter-faq-audit.spec.js
        type: string

      target_env:
        description: Target environment
        required: true
        default: UAT
        type: choice
        options:
          - UAT
          - PROD

jobs:
  execute:
    runs-on: [self-hosted, macOS, qa-agent]
    timeout-minutes: 120

    permissions:
      contents: read
      actions: read

    env:
      TARGET_ENV: ${{ inputs.target_env }}
      RUN_TARGET: local
      MAX_RUN_HISTORY: '3'
      HEADLESS: 'false'
      PLAYWRIGHT_CHANNEL: chrome

      WEB_BASE_URL: ${{ inputs.target_env == 'PROD' && 'https://www.woolworths.com.au' || 'https://uatsite.woolworths.com.au' }}
      BASE_URL: ${{ inputs.target_env == 'PROD' && 'https://www.woolworths.com.au' || 'https://uatsite.woolworths.com.au' }}

      GEMINI_AUTH_MODE: vertex
      GOOGLE_CLOUD_PROJECT: alextest-6d556
      GOOGLE_CLOUD_LOCATION: us-central1
      GOOGLE_APPLICATION_CREDENTIALS: /Users/skaligotla/agentic-qa-credentials/service-account.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          SCENARIO_FILENAME: ${{ inputs.scenario_filename }}
          SCENARIO_CONTENT: ${{ inputs.scenario_content }}
          SPEC_PATH: ${{ inputs.spec_path }}
        run: |
          set -euo pipefail

          if [[ "$RUN_MODE" == "scenario" ]]; then
            [[ "$SCENARIO_FILENAME" =~ ^[A-Za-z0-9._-]+\.txt$ ]] || {
              echo "Invalid scenario filename: $SCENARIO_FILENAME"
              exit 1
            }

            [[ -n "$SCENARIO_CONTENT" ]] || {
              echo "scenario_content is required for scenario mode"
              exit 1
            }
          fi

          if [[ "$RUN_MODE" == "spec" ]]; then
            case "$SPEC_PATH" in
              generated-specs/web/*.spec.js) ;;
              *)
                echo "Invalid spec path: $SPEC_PATH"
                exit 1
                ;;
            esac
          fi

      - name: Create incoming scenario
        if: inputs.run_mode == 'scenario'
        shell: bash
        env:
          SCENARIO_FILENAME: ${{ inputs.scenario_filename }}
          SCENARIO_CONTENT: ${{ inputs.scenario_content }}
        run: |
          mkdir -p scenarios/incoming
          printf '%s\n' "$SCENARIO_CONTENT" \
            > "scenarios/incoming/$SCENARIO_FILENAME"

      - name: Install dependencies
        run: npm ci

      - name: Validate framework
        run: npm run check

      - name: Run scenario lifecycle
        if: inputs.run_mode == 'scenario'
        run: |
          npm run scenario:build-and-run -- \
            "scenarios/incoming/${{ inputs.scenario_filename }}"

      - name: Validate generated spec
        if: inputs.run_mode == 'spec'
        run: |
          test -f "${{ inputs.spec_path }}" || {
            echo "Spec not found: ${{ inputs.spec_path }}"
            exit 1
          }

          node scripts/validate-generated-spec.js \
            "${{ inputs.spec_path }}"

      - name: Run existing Playwright spec
        if: inputs.run_mode == 'spec'
        run: |
          npx playwright test \
            "${{ inputs.spec_path }}" \
            --project=chromium \
            --headed

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ github.run_id }}
          path: |
            artifacts/runs/
            reports/
            generated-specs/
            test-results/
            playwright-report/
            visual-actuals/
            visual-diffs/
          if-no-files-found: ignore
          retention-days: 14
