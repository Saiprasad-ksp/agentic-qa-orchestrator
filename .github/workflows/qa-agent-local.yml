name: QA agent local runner

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: What should be executed?
        required: true
        default: scenario
        type: choice
        options:
          - scenario
          - spec

      scenario_filename:
        description: Scenario filename ending in .txt
        required: false
        default: web-helpcenter-faq-audit.txt
        type: string

      scenario_content:
        description: Complete business scenario content
        required: false
        type: string

      spec_path:
        description: Existing generated Playwright spec
        required: false
        default: generated-specs/web/web-helpcenter-faq-audit.spec.js
        type: string

      target_env:
        description: Target environment
        required: true
        default: UAT
        type: choice
        options:
          - UAT
          - PROD

      mobile_platform:
        description: Mobile platform when PLATFORM is mobile
        required: false
        default: android
        type: choice
        options:
          - android
          - ios

jobs:
  execute:
    runs-on:
      - self-hosted
      - macOS
      - qa-agent

    timeout-minutes: 120

    permissions:
      contents: read
      actions: read

    env:
      TARGET_ENV: ${{ inputs.target_env }}
      MOBILE_PLATFORM: ${{ inputs.mobile_platform }}
      RUN_TARGET: local
      MAX_RUN_HISTORY: '3'

      HEADLESS: 'false'
      PLAYWRIGHT_CHANNEL: chrome

      WEB_BASE_URL: ${{ inputs.target_env == 'PROD' && 'https://www.woolworths.com.au' || 'https://uatsite.woolworths.com.au' }}
      BASE_URL: ${{ inputs.target_env == 'PROD' && 'https://www.woolworths.com.au' || 'https://uatsite.woolworths.com.au' }}

      URL_PROD: https://www.woolworths.com.au
      URL_UAT: https://uatsite.woolworths.com.au

      OLIVE_OPEN_TIMEOUT_MS: '120000'
      OLIVE_SURFACE_TIMEOUT_MS: '20000'
      OLIVE_INITIAL_GREETING_TIMEOUT_MS: '45000'

      GEMINI_AUTH_MODE: vertex
      GOOGLE_CLOUD_PROJECT: alextest-6d556
      GOOGLE_CLOUD_LOCATION: us-central1
      GOOGLE_APPLICATION_CREDENTIALS: /Users/skaligotla/agentic-qa-credentials/service-account.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate workflow inputs
        shell: bash
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          SCENARIO_FILENAME: ${{ inputs.scenario_filename }}
          SCENARIO_CONTENT: ${{ inputs.scenario_content }}
          SPEC_PATH: ${{ inputs.spec_path }}
        run: |
          set -euo pipefail

          case "$RUN_MODE" in
            scenario)
              [[ "$SCENARIO_FILENAME" =~ ^[A-Za-z0-9._-]+\.txt$ ]] || {
                echo "Invalid scenario filename: $SCENARIO_FILENAME"
                exit 1
              }

              [[ -n "$SCENARIO_CONTENT" ]] || {
                echo "scenario_content is required in scenario mode"
                exit 1
              }
              ;;

            spec)
              [[ -n "$SPEC_PATH" ]] || {
                echo "spec_path is required in spec mode"
                exit 1
              }

              case "$SPEC_PATH" in
                generated-specs/*.spec.js | generated-specs/**/*.spec.js)
                  ;;
                *)
                  echo "Invalid spec path: $SPEC_PATH"
                  exit 1
                  ;;
              esac
              ;;

            *)
              echo "Unsupported run_mode: $RUN_MODE"
              exit 1
              ;;
          esac

      - name: Create incoming scenario
        if: inputs.run_mode == 'scenario'
        shell: bash
        env:
          SCENARIO_FILENAME: ${{ inputs.scenario_filename }}
          SCENARIO_CONTENT: ${{ inputs.scenario_content }}
        run: |
          set -euo pipefail

          mkdir -p scenarios/incoming

          printf '%s\n' "$SCENARIO_CONTENT" \
            > "scenarios/incoming/$SCENARIO_FILENAME"

          sed -n '1,80p' \
            "scenarios/incoming/$SCENARIO_FILENAME"

      - name: Install dependencies
        run: npm ci

      - name: Validate framework
        run: npm run check

      - name: Run scenario lifecycle
        if: inputs.run_mode == 'scenario'
        run: |
          npm run scenario:build-and-run -- \
            "scenarios/incoming/${{ inputs.scenario_filename }}"

      - name: Confirm generated spec exists
        if: inputs.run_mode == 'spec'
        shell: bash
        run: |
          test -f "${{ inputs.spec_path }}" || {
            echo "Spec not found: ${{ inputs.spec_path }}"
            exit 1
          }

      - name: Validate generated spec
        if: inputs.run_mode == 'spec'
        run: |
          node scripts/validate-generated-spec.js \
            "${{ inputs.spec_path }}"

      - name: Run existing Playwright spec
        if: inputs.run_mode == 'spec'
        run: |
          npx playwright test \
            "${{ inputs.spec_path }}" \
            --project=chromium \
            --headed

      - name: Prepare shareable report
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p reports/shareable

          REPORT_SCRIPT="$(
            node - <<'NODE'
          const pkg = require('./package.json');
          const scripts = pkg.scripts || {};

          const preferred = [
            'report:shareable',
            'report:generate',
            'report:build',
            'generate:report',
            'generate-report'
          ];

          const selected = preferred.find(name => scripts[name]);

          if (selected) {
            process.stdout.write(selected);
          }
          NODE
          )"

          if [[ -n "$REPORT_SCRIPT" ]]; then
            echo "Running npm run $REPORT_SCRIPT"
            npm run "$REPORT_SCRIPT" || true
          fi

          if [[ -d "playwright-report" ]]; then
            rm -rf reports/shareable/playwright-report
            mkdir -p reports/shareable/playwright-report

            cp -R playwright-report/. \
              reports/shareable/playwright-report/
          fi

          if [[ -d "test-results" ]]; then
            rm -rf reports/shareable/test-results
            mkdir -p reports/shareable/test-results

            cp -R test-results/. \
              reports/shareable/test-results/
          fi

          if [[ -d "reports/screenshots" ]]; then
            rm -rf reports/shareable/screenshots
            mkdir -p reports/shareable/screenshots

            cp -R reports/screenshots/. \
              reports/shareable/screenshots/
          fi

          if [[ -d "reports/transcripts" ]]; then
            rm -rf reports/shareable/transcripts
            mkdir -p reports/shareable/transcripts

            cp -R reports/transcripts/. \
              reports/shareable/transcripts/
          fi

          if [[ -d "reports/audits" ]]; then
            rm -rf reports/shareable/audits
            mkdir -p reports/shareable/audits

            cp -R reports/audits/. \
              reports/shareable/audits/
          fi

          find reports/shareable \
            -maxdepth 4 \
            -type f \
            -print \
            2>/dev/null | head -100

          exit 0

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ github.run_id }}
          path: |
            artifacts/runs/
            reports/
            generated-specs/
            test-results/
            playwright-report/
            visual-actuals/
            visual-baselines/
            visual-diffs/
          if-no-files-found: warn
          retention-days: 14
